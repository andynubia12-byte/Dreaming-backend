$('#importFileInput').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  try {
    const raw = JSON.parse(await file.text());
    const incoming = Array.isArray(raw) ? raw : Array.isArray(raw.sessions) ? raw.sessions : raw.id ? [raw] : [];
    if (!incoming.length) throw new Error('文件中没有对话数据');
    let imported = 0;
    for (const s of incoming) {
      if (!s || !s.id || !Array.isArray(s.messages)) continue;
      const existing = state.sessions.find((x) => x.id === s.id);
      if (!existing || (s.updatedAt || 0) > (existing.updatedAt || 0)) {
        if (existing) state.sessions = state.sessions.filter((x) => x.id !== s.id);
        state.sessions.push(s);
        await dbPut(JSON.parse(JSON.stringify(s))).catch(() => {});
        imported += 1;
      }
    }
    sortSessions();
    renderAll();
    toast(`已导入 ${imported} 个对话`);
  } catch (err) {
    toast('导入失败：' + err.message, 'error');
  }
});


/* ============================================================ benchmark */
const benchFlags = {
  open: false,
  batches: [],
  current: null,
  tab: 'config',
  running: false,
  paused: false,
  saveTimer: null,
  tickTimer: null,
  pendingSchemeId: null,
  filters: { status: '', model: '' },
};

function benchSleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function benchHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i += 1) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}

function makeBenchBatch() {
  const now = Date.now();
  const defaultCodex = state.codexModels.find((m) => m.slug === settings.codex.model) || state.codexModels[0];
  const models = [];
  if (defaultCodex) {
    models.push({ provider: 'codex', model: defaultCodex.slug, label: 'Codex · ' + (defaultCodex.displayName || defaultCodex.slug) });
  }
  const dsModel = settings.deepseek.model || 'deepseek-flash';
  models.push({ provider: 'deepseek', model: dsModel, label: 'DeepSeek · ' + dsModel });
  return {
    id: uid(),
    name: '批次 ' + new Date(now).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
    createdAt: now,
    updatedAt: now,
    status: 'draft',
    system: '',
    questionsText: '',
    models,
    schemes: [{ id: uid(), name: '上下文方案 1', files: [] }],
    params: {
      repeats: 1,
      concurrency: 2,
      retries: 1,
      maxTokens: '',
      temperature: '',
      codexEffort: settings.codex.effort || 'high',
      deepseekThinking: settings.deepseek.thinking || '',
    },
    runs: [],
    differences: [],
    configHash: '',
    startedAt: null,
    completedAt: null,
  };
}

function normalizeBenchBatch(raw) {
  const base = makeBenchBatch();
  const batch = { ...base, ...raw };
  batch.params = { ...base.params, ...(raw.params || {}) };
  batch.models = Array.isArray(raw.models) ? raw.models : base.models;
  batch.schemes = Array.isArray(raw.schemes) && raw.schemes.length ? raw.schemes : base.schemes;
  batch.runs = Array.isArray(raw.runs) ? raw.runs : [];
  batch.questionsText = raw.questionsText != null ? String(raw.questionsText) : '';
  batch.differences = Array.isArray(raw.differences) ? raw.differences : [];
  if (batch.status === 'running') batch.status = 'paused';
  for (const run of batch.runs) {
    if (run.status === 'running') run.status = 'pending';
  }
  return batch;
}

function benchQuestions(batch) {
  return String(batch?.questionsText || '')
    .split(/\r?\n/)
    .map((x) => x.trim())
    .filter(Boolean);
}

function benchRepeats(batch) {
  return Math.max(1, Math.min(20, Math.floor(Number(batch?.params?.repeats) || 1)));
}

function benchModelCandidates() {
  const list = [];
  const codexSource = state.codexModels.length
    ? [...state.codexModels]
    : (settings.codex.model ? [{ slug: settings.codex.model, displayName: settings.codex.model }] : []);
  if (settings.codex.model && !codexSource.some((m) => m.slug === settings.codex.model)) {
    codexSource.unshift({ slug: settings.codex.model, displayName: settings.codex.model });
  }
  for (const m of codexSource) {
    list.push({
      key: 'codex:' + m.slug,
      provider: 'codex',
      model: m.slug,
      label: 'Codex · ' + (m.displayName || m.slug),
    });
  }
  const dsIds = Array.from(new Set([...state.deepseekModels, ...DEEPSEEK_PRESET_MODELS].filter(Boolean)));
  for (const id of dsIds) {
    list.push({ key: 'deepseek:' + id, provider: 'deepseek', model: id, label: 'DeepSeek · ' + id });
  }
  return list;
}

function benchConfigHash(batch) {
  return benchHash(JSON.stringify({
    system: batch.system,
    models: batch.models.map((m) => m.provider + ':' + m.model),
    schemes: batch.schemes.map((sc) => ({
      name: sc.name,
      files: sc.files.map((f) => ({ name: f.name, chars: f.chars || 0, hash: benchHash(String(f.content || '')) })),
    })),
    questions: benchQuestions(batch),
    repeats: benchRepeats(batch),
    params: {
      maxTokens: batch.params.maxTokens,
      temperature: batch.params.temperature,
      codexEffort: batch.params.codexEffort,
      deepseekThinking: batch.params.deepseekThinking,
    },
  }));
}

function benchShuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function benchBuildRuns(batch) {
  const questions = benchQuestions(batch);
  const repeats = benchRepeats(batch);
  const runs = [];
  let index = 0;
  for (const model of batch.models) {
    for (const scheme of batch.schemes) {
      for (let qi = 0; qi < questions.length; qi += 1) {
        for (let rep = 1; rep <= repeats; rep += 1) {
          runs.push({
            id: uid(),
            index: index++,
            provider: model.provider,
            model: model.model,
            modelLabel: model.label,
            schemeId: scheme.id,
            schemeName: scheme.name,
            questionIndex: qi,
            question: questions[qi],
            repeat: rep,
            status: 'pending',
            attempts: 0,
            startedAt: null,
            endedAt: null,
            durationMs: null,
            usage: null,
            output: '',
            reasoning: '',
            error: '',
            request: null,
            canonicalRequest: null,
            finishReason: '',
            blindId: '',
          });
        }
      }
    }
  }
  const order = benchShuffle(runs);
  order.forEach((run, i) => { run.blindId = 'R-' + String(i + 1).padStart(3, '0'); });
  return runs;
}

function benchTotalRuns(batch) {
  return (batch.models.length || 0) * (batch.schemes.length || 0) * benchQuestions(batch).length * benchRepeats(batch);
}

function benchCounts(batch) {
  const runs = batch?.runs || [];
  const done = runs.filter((r) => r.status === 'done').length;
  const errors = runs.filter((r) => r.status === 'error').length;
  const running = runs.filter((r) => r.status === 'running').length;
  const pending = runs.filter((r) => r.status === 'pending').length;
  const tokens = runs.reduce((sum, r) => sum + (Number(r.usage?.total) || 0), 0);
  return { total: runs.length, done, errors, running, pending, terminal: done + errors, tokens };
}

function benchAllFinished(batch) {
  return Boolean(batch?.runs?.length) && batch.runs.every((r) => r.status === 'done' || r.status === 'error');
}

function benchFmtDuration(ms) {
  if (!ms || ms < 0) return '0s';
  const total = Math.round(ms / 1000);
  if (total < 60) return total + 's';
  const m = Math.floor(total / 60);
  const s = total % 60;
  if (m < 60) return m + 'm ' + s + 's';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}

async function benchLoadAll() {
  if (!db) return;
  try {
    benchFlags.batches = (await benchGetAll()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  } catch (err) {
    console.warn('加载批量测试失败', err);
  }
}

function benchScheduleSave() {
  if (!benchFlags.current) return;
  clearTimeout(benchFlags.saveTimer);
  benchFlags.saveTimer = setTimeout(() => { benchPersist(); }, 350);
}

async function benchPersist() {
  const batch = benchFlags.current;
  if (!batch) return;
  batch.updatedAt = Date.now();
  if (db) {
    try { await benchPut(batch); } catch (err) { console.warn('保存批量测试失败', err); }
  }
  const i = benchFlags.batches.findIndex((b) => b.id === batch.id);
  if (i >= 0) benchFlags.batches[i] = batch;
  else benchFlags.batches.unshift(batch);
  benchFlags.batches.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  if (benchFlags.open) renderBenchBatchList();
}

function benchEnsureCodexModel() {
  const b = benchFlags.current;
  if (!b || benchFlags.running || b.runs.length) return;
  if (b.models.some((m) => m.provider === 'codex')) return;
  const slug = settings.codex.model || state.codexDefaultModel || state.codexModels[0]?.slug;
  if (!slug) return;
  const meta = state.codexModels.find((m) => m.slug === slug);
  b.models.unshift({ provider: 'codex', model: slug, label: 'Codex · ' + (meta?.displayName || slug) });
  benchScheduleSave();
}

function benchRefreshModelUI() {
  if (!benchFlags.open) return;
  renderBenchHeader();
  if (benchFlags.tab === 'config') renderBenchConfig();
}

async function openBenchPage() {
  benchFlags.open = true;
  $('#benchPage').hidden = false;
  if (!state.codexModels.length) {
    await Promise.race([
      loadCodexModels(),
      new Promise((resolve) => setTimeout(resolve, 3000)),
    ]).catch(() => {});
  }
  if (db) await benchLoadAll();
  if (!benchFlags.current) {
    const latest = benchFlags.batches[0];
    benchFlags.current = latest ? normalizeBenchBatch(latest) : makeBenchBatch();
    if (!latest) {
      benchFlags.batches.push(benchFlags.current);
      await benchPersist();
    } else {
      await benchPersist();
    }
  }
  benchFlags.tab = benchFlags.current.runs.length ? 'results' : 'config';
  benchRenderAll();
}

function closeBenchPage() {
  benchFlags.open = false;
  $('#benchPage').hidden = true;
}

async function benchSelectBatch(id) {
  if (benchFlags.running) { toast('测试运行中，请先暂停再切换批次'); return; }
  const raw = benchFlags.batches.find((b) => b.id === id);
  if (!raw) return;
  benchFlags.current = normalizeBenchBatch(raw);
  benchFlags.tab = benchFlags.current.runs.length ? 'results' : 'config';
  benchPersist();
  benchRenderAll();
}

async function benchNewBatch() {
  if (benchFlags.running) { toast('测试运行中，请先暂停再新建批次'); return; }
  const batch = makeBenchBatch();
  benchFlags.current = batch;
  benchFlags.batches.unshift(batch);
  benchFlags.tab = 'config';
  benchFlags.filters = { status: '', model: '' };
  await benchPersist();
  benchRenderAll();
}

async function benchDeleteBatch(id) {
  if (benchFlags.running) { toast('测试运行中，请先暂停再删除批次'); return; }
  const batch = benchFlags.batches.find((b) => b.id === id);
  if (!batch) return;
  if (!confirm(`删除批次「${batch.name}」及其全部结果？`)) return;
  await benchDelete(id).catch(() => {});
  benchFlags.batches = benchFlags.batches.filter((b) => b.id !== id);
  if (benchFlags.current?.id === id) {
    const latest = benchFlags.batches[0];
    benchFlags.current = latest ? normalizeBenchBatch(latest) : makeBenchBatch();
    if (!latest) benchFlags.batches.push(benchFlags.current);
  }
  benchRenderAll();
}

/* ---------------- benchmark rendering ---------------- */

function benchRenderAll() {
  if (!benchFlags.open) return;
  renderBenchHeader();
  renderBenchBatchList();
  renderBenchStatusbar();
  $$('.bench-tabs button').forEach((b) => b.classList.toggle('active', b.dataset.btab === benchFlags.tab));
  if (benchFlags.tab === 'config') {
    $('#benchConfig').hidden = false;
    $('#benchResults').hidden = true;
    renderBenchConfig();
  } else {
    $('#benchConfig').hidden = true;
    $('#benchResults').hidden = false;
    renderBenchResults();
  }
  renderBenchHeader();
}

function renderBenchHeader() {
  const b = benchFlags.current;
  if (!b) return;
  const counts = benchCounts(b);
  const total = counts.total || benchTotalRuns(b);
  $('#benchSub').textContent = `${b.name} · ${b.models.length} 模型 · ${b.schemes.length} 方案 · ${benchQuestions(b).length} 问题 · ${total} 次运行${counts.total ? ` · ${counts.terminal}/${counts.total} 已完成` : ''}`;
  const runBtn = $('#benchRunBtn');
  runBtn.disabled = benchFlags.running;
  if (benchFlags.running) runBtn.textContent = '运行中…';
  else if (counts.total && counts.pending > 0) runBtn.textContent = '继续测试';
  else runBtn.textContent = '开始测试';
  $('#benchPauseBtn').hidden = !benchFlags.running;
  $('#benchPauseBtn').textContent = benchFlags.paused ? '继续' : '暂停';
  $('#benchNewBtn').disabled = benchFlags.running;
  $$('.bench-tabs button').forEach((x) => {
    x.classList.toggle('active', x.dataset.btab === benchFlags.tab);
  });
}

function renderBenchBatchList() {
  const list = $('#benchBatchList');
  if (!list) return;
  if (!benchFlags.batches.length) {
    list.innerHTML = '<div class="bench-empty">还没有批次</div>';
    return;
  }
  list.innerHTML = benchFlags.batches.map((b) => {
    const c = benchCounts(b);
    const statusMap = { draft: '草稿', running: '运行中', paused: '已暂停', completed: '已完成' };
    return `
      <div class="bench-batch-item ${b.id === benchFlags.current?.id ? 'active' : ''}" data-bench-batch="${esc(b.id)}">
        <div class="bench-batch-name">${esc(b.name)}</div>
        <div class="bench-batch-meta">
          <span>${esc(statusMap[b.status] || b.status)}</span>
          <span>${c.terminal}/${c.total || benchTotalRuns(b)}</span>
          <span>${esc(fmtTime(b.updatedAt))}</span>
        </div>
        <button class="bench-batch-del" data-bench-del="${esc(b.id)}" title="删除批次">✕</button>
      </div>`;
  }).join('');
  $$('#benchBatchList [data-bench-batch]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-bench-del]')) return;
      benchSelectBatch(el.dataset.benchBatch);
    });
  });
  $$('#benchBatchList [data-bench-del]').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); benchDeleteBatch(btn.dataset.benchDel); });
  });
}

function renderBenchStatusbar() {
  const b = benchFlags.current;
  const bar = $('#benchStatusbar');
  if (!b || !bar) return;
  const c = benchCounts(b);
  const total = c.total || benchTotalRuns(b);
  const pct = total ? Math.round((c.terminal / total) * 100) : 0;
  const elapsed = b.startedAt ? (b.completedAt || Date.now()) - b.startedAt : 0;
  const statusMap = { draft: '草稿', running: '运行中', paused: '已暂停', completed: '已完成' };
  const cls = b.status === 'running' ? 'running' : b.status === 'completed' ? 'done' : '';
  bar.innerHTML = `
    <div class="bench-status-row">
      <span class="status-pill ${cls}">${esc(statusMap[b.status] || b.status)}</span>
      <span><strong>${c.terminal}/${total}</strong> 已完成</span>
      <span>运行中 <strong>${c.running}</strong></span>
      <span>错误 <strong>${c.errors}</strong></span>
      <span>tokens <strong>${c.tokens ? fmtChars(c.tokens) : '0'}</strong></span>
      <span>耗时 <strong>${benchFmtDuration(elapsed)}</strong></span>
      ${b.status === 'paused' ? '<span class="badge warn">已暂停，可继续</span>' : ''}
    </div>
    <div class="bench-progress"><div style="width:${pct}%"></div></div>`;
}

function bindBenchConfig() {
  const b = benchFlags.current;
  if (!b) return;
  $$('[data-bench-model]').forEach((cb) => cb.addEventListener('change', () => {
    const key = cb.dataset.benchModel;
    const cand = benchModelCandidates().find((m) => m.key === key);
    if (!cand) return;
    if (cb.checked) {
      if (!b.models.some((m) => m.provider === cand.provider && m.model === cand.model)) {
        b.models.push({ provider: cand.provider, model: cand.model, label: cand.label });
      }
    } else {
      b.models = b.models.filter((m) => !(m.provider === cand.provider && m.model === cand.model));
    }
    benchScheduleSave();
    benchUpdateMatrixInfo();
  }));

  $('#benchReloadModelsBtn')?.addEventListener('click', async () => {
    toast('正在刷新模型列表…');
    await loadCodexModels();
    benchRefreshModelUI();
    toast(state.codexModels.length ? `已加载 ${state.codexModels.length} 个 Codex 模型` : 'Codex 模型加载失败', state.codexModels.length ? undefined : 'error');
  });

  const system = $('#benchSystem');
  if (system) system.addEventListener('input', () => { b.system = system.value; benchScheduleSave(); benchUpdateMatrixInfo(); });

  const questions = $('#benchQuestions');
  if (questions) questions.addEventListener('input', () => {
    b.questionsText = questions.value;
    benchScheduleSave();
    benchUpdateMatrixInfo();
  });

  $('#benchAddScheme')?.addEventListener('click', () => {
    b.schemes.push({ id: uid(), name: `上下文方案 ${b.schemes.length + 1}`, files: [] });
    benchScheduleSave(); renderBenchConfig();
  });
  $$('[data-scheme-name]').forEach((input) => input.addEventListener('change', () => {
    const sc = b.schemes.find((x) => x.id === input.dataset.schemeName);
    if (!sc) return;
    sc.name = input.value.trim() || sc.name;
    input.value = sc.name;
    benchScheduleSave(); renderBenchConfig();
  }));
  $$('[data-scheme-del]').forEach((btn) => btn.addEventListener('click', () => {
    if (b.schemes.length <= 1) { toast('至少保留一个上下文方案', 'error'); return; }
    if (!confirm('删除该上下文方案及其文件？')) return;
    b.schemes = b.schemes.filter((x) => x.id !== btn.dataset.schemeDel);
    benchScheduleSave(); renderBenchConfig();
  }));
  $$('[data-scheme-add-file]').forEach((btn) => btn.addEventListener('click', () => {
    benchFlags.pendingSchemeId = btn.dataset.schemeAddFile;
    $('#benchFileInput')?.click();
  }));
  const fileInput = $('#benchFileInput');
  if (fileInput) fileInput.addEventListener('change', async () => {
    const schemeId = benchFlags.pendingSchemeId;
    benchFlags.pendingSchemeId = null;
    if (!schemeId) return;
    await benchAddFilesToScheme(schemeId, fileInput.files);
    fileInput.value = '';
  });
  $$('[data-bench-file-up]').forEach((btn) => btn.addEventListener('click', () => benchMoveSchemeFile(btn.dataset.benchFileUp, -1)));
  $$('[data-bench-file-down]').forEach((btn) => btn.addEventListener('click', () => benchMoveSchemeFile(btn.dataset.benchFileDown, 1)));
  $$('[data-bench-file-del]').forEach((btn) => btn.addEventListener('click', () => {
    const [sid, fid] = btn.dataset.benchFileDel.split(':');
    const sc = b.schemes.find((x) => x.id === sid);
    if (!sc) return;
    sc.files = sc.files.filter((f) => f.id !== fid);
    benchScheduleSave(); renderBenchConfig();
  }));
  $$('[data-bench-file-preview]').forEach((el) => el.addEventListener('click', () => {
    const [sid, fid] = el.dataset.benchFilePreview.split(':');
    const sc = b.schemes.find((x) => x.id === sid);
    const f = sc?.files.find((x) => x.id === fid);
    if (f) openModal(`预览 · ${f.name}（${fmtChars(f.chars)} 字）`, `<pre>${esc(f.content)}</pre>`);
  }));

  $('#benchImportQuestions')?.addEventListener('click', () => $('#benchQuestionFile')?.click());
  const qFile = $('#benchQuestionFile');
  if (qFile) qFile.addEventListener('change', async () => {
    const file = qFile.files?.[0];
    qFile.value = '';
    if (!file) return;
    if (file.size > MAX_FILE_BYTES) { toast('问题文件超过 2MB', 'error'); return; }
    try {
      const text = await file.text();
      const lines = text.split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
      const existing = String(b.questionsText || '').trim();
      b.questionsText = [existing, ...lines].filter(Boolean).join('\n');
      if ($('#benchQuestions')) $('#benchQuestions').value = b.questionsText;
      benchScheduleSave(); benchUpdateMatrixInfo();
      toast(`已导入 ${lines.length} 个问题`);
    } catch (err) {
      toast('导入失败：' + err.message, 'error');
    }
  });

  const bindParam = (id, key, numeric) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener('input', () => {
      b.params[key] = numeric ? el.value : el.value;
      benchScheduleSave(); benchUpdateMatrixInfo();
    });
  };
  bindParam('#benchRepeats', 'repeats', true);
  bindParam('#benchConcurrency', 'concurrency', true);
  bindParam('#benchRetries', 'retries', true);
  bindParam('#benchMaxTokens', 'maxTokens', false);
  bindParam('#benchTemperature', 'temperature', false);
  const codexEffort = $('#benchCodexEffort');
  if (codexEffort) codexEffort.addEventListener('change', () => { b.params.codexEffort = codexEffort.value; benchScheduleSave(); benchUpdateMatrixInfo(); });
  const dsThinking = $('#benchDeepseekThinking');
  if (dsThinking) dsThinking.addEventListener('change', () => { b.params.deepseekThinking = dsThinking.value; benchScheduleSave(); benchUpdateMatrixInfo(); });
  $('#benchStartBtn')?.addEventListener('click', benchStart);
}

async function benchAddFilesToScheme(schemeId, fileList) {
  const b = benchFlags.current;
  const sc = b?.schemes.find((x) => x.id === schemeId);
  if (!sc) return;
  const files = Array.from(fileList || []);
  let added = 0;
  const skipped = [];
  for (const file of files) {
    if (!isTextFile(file)) { skipped.push(file.name + '（非文本）'); continue; }
    if (file.size > MAX_FILE_BYTES) { skipped.push(file.name + '（>2MB）'); continue; }
    if (sc.files.some((f) => f.name === file.name && f.chars === file.size)) { skipped.push(file.name + '（已存在）'); continue; }
    try {
      const content = await file.text();
      sc.files.push({ id: uid(), name: file.name, chars: content.length, content });
      added += 1;
    } catch { skipped.push(file.name + '（读取失败）'); }
  }
  if (added) {
    benchScheduleSave();
    renderBenchConfig();
    toast(`已添加 ${added} 个文件到「${sc.name}」`);
  }
  if (skipped.length) toast('已跳过：' + skipped.slice(0, 3).join('；'), 'error');
}

function benchMoveSchemeFile(key, dir) {
  const [sid, fid] = String(key).split(':');
  const b = benchFlags.current;
  const sc = b?.schemes.find((x) => x.id === sid);
  if (!sc) return;
  const i = sc.files.findIndex((f) => f.id === fid);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sc.files.length) return;
  const [item] = sc.files.splice(i, 1);
  sc.files.splice(j, 0, item);
  benchScheduleSave();
  renderBenchConfig();
}

function benchUpdateMatrixInfo() {
  const b = benchFlags.current;
  if (!b) return;
  const total = benchTotalRuns(b);
  const info = $('#benchMatrixInfo');
  if (info) info.innerHTML = `<b>${b.models.length}</b> 模型 × <b>${b.schemes.length}</b> 方案 × <b>${benchQuestions(b).length}</b> 问题 × <b>${benchRepeats(b)}</b> 重复 = <b>${total}</b> 次请求`;
  const hint = $('#benchRunHint');
  if (hint) hint.textContent = total ? `共 ${total} 次请求` : '请先选择模型、方案并输入问题';
  const startBtn = $('#benchStartBtn');
  if (startBtn) startBtn.disabled = benchFlags.running || total === 0;
}

/* ---------------- benchmark execution ---------------- */

async function benchStart() {
  const b = benchFlags.current;
  if (!b || benchFlags.running) return;
  if (!b.models.length) { toast('请选择至少一个模型', 'error'); return; }
  if (!b.schemes.length) { toast('请至少创建一个上下文方案', 'error'); return; }
  const questions = benchQuestions(b);
  if (!questions.length) { toast('请至少输入一个测试问题', 'error'); return; }
  const total = benchTotalRuns(b);
  if (total > 500 && !confirm(`本次将执行 ${total} 次请求，可能耗时较长并产生较多费用，继续？`)) return;

  const hash = benchConfigHash(b);
  if (b.runs.length && hash !== b.configHash) {
    if (!confirm('配置已变更，重新生成矩阵会清空已有结果。继续？')) return;
  }
  const finished = benchAllFinished(b);
  if (finished && hash === b.configHash) {
    toast('当前批次已完成；修改配置或新建批次可重新运行');
    return;
  }
  if (!b.runs.length || hash !== b.configHash) {
    b.runs = benchBuildRuns(b);
    b.configHash = hash;
    b.startedAt = Date.now();
    b.completedAt = null;
    b.blindAssigned = true;
    b.status = 'draft';
  }
  b.differences = [
    '所有模型使用相同系统提示词、参考资料构造规则（developer reference）、问题文本与重复次数。',
    `推理强度按提供商分别设置：Codex=${b.params.codexEffort || 'high'}；DeepSeek thinking=${b.params.deepseekThinking || '默认开启'}。两者语义不完全等价。`,
    b.params.temperature !== ''
      ? `DeepSeek 使用 temperature=${b.params.temperature}；Codex Responses 不支持 temperature，按服务端默认执行。`
      : '未设置 temperature；DeepSeek 使用服务端默认，Codex 不支持 temperature。',
    'DeepSeek 将 developer 角色视同 user，Codex 保留 developer 语义；应用用独立消息与 data-only 声明保证两者都不与当前用户消息混淆。',
    '空 system 时 Codex 仍发送空 instructions，DeepSeek 省略 instructions 字段；这是两家 API 的字段兼容差异。',
    '不同提供商的模型版本、服务端实现和采样默认值无法完全统一，这些差异不能被本实验消除。',
  ];
  b.runs.forEach((r) => { if (r.status === 'running') r.status = 'pending'; });
  b.status = 'running';
  b.startedAt = b.startedAt || Date.now();
  b.completedAt = null;
  benchFlags.tab = 'results';
  benchRenderAll();
  await benchPersist();
  benchRunPool();
}

async function benchRunPool() {
  const b = benchFlags.current;
  if (!b || benchFlags.running) return;
  benchFlags.running = true;
  benchFlags.paused = false;
  b.status = 'running';
  renderBenchHeader();
  renderBenchStatusbar();
  benchStartTicker();
  await benchPersist();

  const concurrency = Math.max(1, Math.min(5, Math.floor(Number(b.params.concurrency) || 1)));
  const errors = [];
  const worker = async () => {
    while (benchFlags.running && !benchFlags.paused) {
      const run = b.runs.find((r) => r.status === 'pending');
      if (!run) break;
      run.status = 'running';
      run.startedAt = Date.now();
      run.attempts = 0;
      run.error = '';
      b.updatedAt = Date.now();
      renderBenchStatusbar();
      try { await benchPersist(); } catch (err) { console.warn(err); }

      let result;
      try {
        result = await benchExecuteRun(b, run);
      } catch (err) {
        result = { ok: false, error: err.message || String(err) };
      }
      if (result.paused) {
        run.status = 'pending';
        run.error = '';
        run.startedAt = null;
        run.endedAt = null;
        run.durationMs = null;
        run.attempts = 0;
        b.status = 'paused';
        break;
      }
      Object.assign(run, result);
      run.status = result.ok ? 'done' : 'error';
      if (!result.ok) errors.push(result.error);
      run.endedAt = Date.now();
      run.durationMs = run.endedAt - (run.startedAt || run.endedAt);
      b.updatedAt = Date.now();
      try {
        renderBenchStatusbar();
        renderBenchBatchList();
        if (benchFlags.tab === 'results') renderBenchResults();
        await benchPersist();
      } catch (err) {
        console.warn('批量测试结果刷新失败', err);
      }
    }
  };
  const workers = Array.from({ length: Math.min(concurrency, Math.max(1, b.runs.filter((r) => r.status !== 'done' && r.status !== 'error').length || 1)) }, () => worker());
  try {
    await Promise.all(workers);
  } catch (err) {
    console.warn('批量测试执行异常', err);
  }
  benchFlags.running = false;
  const pending = b.runs.some((r) => r.status === 'pending');
  b.status = pending ? 'paused' : 'completed';
  if (!pending) b.completedAt = Date.now();
  benchStopTicker();
  benchFlags.paused = false;
  await benchPersist();
  benchRenderAll();
  if (!pending) toast('批量测试已完成');
}

function benchStartTicker() {
  benchStopTicker();
  benchFlags.tickTimer = setInterval(() => {
    if (!benchFlags.open) return;
    renderBenchStatusbar();
    renderBenchHeader();
  }, 1000);
}
function benchStopTicker() {
  clearInterval(benchFlags.tickTimer);
  benchFlags.tickTimer = null;
}

async function benchPause() {
  if (!benchFlags.running) return;
  benchFlags.paused = true;
  if (benchFlags.current) {
    benchFlags.current.status = 'paused';
    renderBenchHeader();
    renderBenchStatusbar();
    await benchPersist();
  }
  toast('已暂停：不再启动新的测试，正在运行的请求会完成');
}

async function benchExecuteRun(batch, run) {
  const scheme = batch.schemes.find((s) => s.id === run.schemeId) || { name: run.schemeName, files: [] };
  const references = scheme.files.map((f) => ({ name: f.name, content: f.content }));
  const body = {
    provider: run.provider,
    model: run.model,
    system: batch.system || '',
    references,
    history: [],
    message: run.question,
    maxTokens: batch.params.maxTokens,
  };
  if (run.provider === 'codex') {
    body.reasoningEffort = batch.params.codexEffort || 'high';
  } else if (run.provider === 'deepseek') {
    body.thinking = batch.params.deepseekThinking || '';
    body.apiKey = settings.deepseek.apiKey || '';
    body.baseURL = settings.deepseek.baseURL || 'https://api.deepseek.com';
    if (batch.params.temperature !== '') body.temperature = batch.params.temperature;
  }
  const canonicalRequest = JSON.parse(JSON.stringify(body));
  delete canonicalRequest.apiKey;
  const params = {
    temperature: body.temperature ?? null,
    maxTokens: body.maxTokens || null,
    reasoningEffort: body.reasoningEffort || null,
    thinking: body.thinking ?? null,
  };
  const maxAttempts = 1 + Math.max(0, Math.min(5, Math.floor(Number(batch.params.retries) || 0)));
  let lastError = '';
  let lastDebug = null;
  for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
    if (!benchFlags.running || benchFlags.paused) {
      return { ok: false, paused: true, error: '已暂停', request: lastDebug, canonicalRequest, params };
    }
    run.attempts = attempt + 1;
    try {
      const res = await benchCallModel(body);
      return {
        ok: true,
        output: res.output,
        reasoning: res.reasoning,
        usage: res.usage,
        request: res.debug,
        canonicalRequest,
        params,
        finishReason: res.finishReason,
        error: '',
      };
    } catch (err) {
      lastError = err.message || String(err);
      if (err.debug) lastDebug = err.debug;
      if (attempt < maxAttempts - 1) await benchSleep(600 * (attempt + 1));
    }
  }
  if (benchFlags.paused || !benchFlags.running) {
    return { ok: false, paused: true, error: '已暂停', request: lastDebug, canonicalRequest, params };
  }
  return { ok: false, error: lastError, request: lastDebug, canonicalRequest, params };
}

async function benchCallModel(body) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 300000);
  let debug = null;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ac.signal,
    });
    if (!resp.ok) {
      const raw = await resp.text().catch(() => '');
      let detail = raw;
      try {
        const j = JSON.parse(raw);
        detail = j.error || j.message || raw;
      } catch { /* noop */ }
      throw new Error(detail || `HTTP ${resp.status}`);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let output = '';
    let reasoning = '';
    let usage = null;
    let finishReason = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of block.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;
          let ev;
          try { ev = JSON.parse(payload); } catch { continue; }
          if (ev.type === 'delta') output += ev.text || '';
          else if (ev.type === 'reasoning') reasoning += ev.text || '';
          else if (ev.type === 'usage') usage = ev.usage || null;
          else if (ev.type === 'meta') { if (ev.debug) debug = ev.debug; }
          else if (ev.type === 'error') throw new Error(ev.message || '模型返回错误');
          else if (ev.type === 'done') finishReason = ev.finishReason || '';
        }
      }
    }
    return { output, reasoning, usage, debug, finishReason };
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('请求超时（300s）');
    err.debug = err.debug || debug;
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/* ---------------- benchmark results & exports ---------------- */

function renderBenchResults() {
  const b = benchFlags.current;
  const wrap = $('#benchResults');
  if (!b || !wrap) return;
  const filters = benchFlags.filters;
  const models = Array.from(new Set(b.runs.map((r) => r.modelLabel)));
  const runs = b.runs.filter((r) => {
    if (filters.status && r.status !== filters.status) return false;
    if (filters.model && r.modelLabel !== filters.model) return false;
    return true;
  });
  const allDone = benchAllFinished(b);
  const success = b.runs.filter((r) => r.status === 'done' && r.output.trim()).length;

  wrap.innerHTML = `
    <div class="bench-section">
      <h2>结果与导出</h2>
      <div class="bench-hint">盲测包只包含问题与匿名答案，不含模型 / 提供商 / 方案身份；答案映射表单独导出。完整 JSON 包含实际请求、输出、耗时、Token 与错误。</div>
      <div class="bench-export-bar">
        <button class="btn" id="benchPreviewBlindBtn" ${allDone && success ? '' : 'disabled'}>预览盲测包</button>
        <button class="btn" id="benchExportBlindBtn" ${allDone && success ? '' : 'disabled'}>导出盲测包 (.md)</button>
        <button class="btn" id="benchExportKeyBtn" ${allDone && success ? '' : 'disabled'}>导出答案映射 (.json)</button>
        <button class="btn" id="benchExportFullBtn" ${allDone ? '' : 'disabled'}>导出完整数据 (.json)</button>
        <span class="bench-hint" style="margin:0">${allDone ? `${success} 条匿名答案` : '完成整个批次后可导出'}</span>
      </div>
    </div>
    ${b.differences?.length ? `<div class="bench-section">
      <h2>实验条件差异记录</h2>
      <div class="bench-hint" style="margin:0">${b.differences.map((d) => '• ' + esc(d)).join('<br/>')}</div>
    </div>` : ''}
    <div class="bench-section">
      <h2>运行明细</h2>
      <div class="row-btns" style="margin:0 0 9px">
        <div class="field" style="min-width:150px;margin:0">
          <select id="benchFilterStatus">
            ${[['', '全部状态'], ['pending','待运行'], ['running','运行中'], ['done','成功'], ['error','失败']].map(([v,l]) => `<option value="${v}" ${filters.status===v?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:190px;margin:0">
          <select id="benchFilterModel">
            <option value="">全部模型</option>
            ${models.map((m) => `<option value="${esc(m)}" ${filters.model===m?'selected':''}>${esc(m)}</option>`).join('')}
          </select>
        </div>
        <span class="bench-hint" style="margin:0">显示 ${runs.length} / ${b.runs.length} 条</span>
      </div>
      ${b.runs.length ? `
      <div class="bench-table-wrap">
        <table class="bench-table">
          <thead><tr><th>#</th><th>模型</th><th>上下文方案</th><th>问题</th><th>轮次</th><th>状态</th><th>耗时</th><th>tokens</th><th>错误 / 输出</th><th></th></tr></thead>
          <tbody>
            ${runs.map((r) => `
              <tr>
                <td>${r.index + 1}</td>
                <td>${esc(r.modelLabel)}</td>
                <td><div class="cell-ellipsis">${esc(r.schemeName)}</div></td>
                <td><div class="cell-ellipsis" title="${esc(r.question)}">Q${r.questionIndex + 1} · ${esc(r.question)}</div></td>
                <td>${r.repeat}</td>
                <td><span class="status-pill ${r.status}">${({pending:'待运行',running:'运行中',done:'成功',error:'失败'})[r.status] || r.status}</span></td>
                <td>${r.durationMs != null ? benchFmtDuration(r.durationMs) : '—'}</td>
                <td>${r.usage?.total != null ? fmtChars(r.usage.total) : '—'}</td>
                <td><div class="cell-ellipsis" title="${esc(r.error || r.output || '')}">${esc(r.error || (r.output ? r.output.slice(0, 80) : '—'))}</div></td>
                <td><button class="mini-btn" data-bench-run-detail="${esc(r.id)}">查看</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : '<div class="bench-empty">还没有运行记录，请先在「配置」中开始测试。</div>'}
    </div>`;

  $('#benchFilterStatus')?.addEventListener('change', (e) => { benchFlags.filters.status = e.target.value; renderBenchResults(); });
  $('#benchFilterModel')?.addEventListener('change', (e) => { benchFlags.filters.model = e.target.value; renderBenchResults(); });
  $$('#benchResults [data-bench-run-detail]').forEach((btn) => btn.addEventListener('click', () => showBenchRunDetail(btn.dataset.benchRunDetail)));
  $('#benchPreviewBlindBtn')?.addEventListener('click', benchPreviewBlind);
  $('#benchExportBlindBtn')?.addEventListener('click', benchExportBlind);
  $('#benchExportKeyBtn')?.addEventListener('click', benchExportKey);
  $('#benchExportFullBtn')?.addEventListener('click', benchExportFull);
}

function showBenchRunDetail(runId) {
  const b = benchFlags.current;
  const run = b?.runs.find((r) => r.id === runId);
  if (!run) return;
  const requestText = run.request ? JSON.stringify(run.request, null, 2) : '（未记录到实际请求）';
  openModal(`运行详情 · ${run.modelLabel} · Q${run.questionIndex + 1}` , `
    <div class="bench-run-detail">
      <div class="attach-summary">
        方案：<b>${esc(run.schemeName)}</b> · 重复：<b>#${run.repeat}</b> · 状态：<b>${esc(run.status)}</b><br/>
        耗时：${run.durationMs != null ? benchFmtDuration(run.durationMs) : '—'} · 尝试次数：${run.attempts || 0} · tokens：${run.usage?.total ?? '—'}
        ${run.usage ? `<br/>输入 ${run.usage.input ?? '?'} / 输出 ${run.usage.output ?? '?'}${run.usage.cached ? ' / 缓存 ' + run.usage.cached : ''}` : ''}
      </div>
      <h4>问题</h4>
      <div class="attach-summary">${esc(run.question)}</div>
      ${run.error ? `<h4>错误</h4><div class="msg-error">${esc(run.error)}</div>` : ''}
      <h4>输出</h4>
      <div class="md">${markdownToHtml(run.output || '（无输出）')}</div>
      ${run.reasoning ? `<details class="reasoning-box"><summary>思考过程</summary><div>${esc(run.reasoning)}</div></details>` : ''}
      <details><summary style="cursor:pointer;font-size:12px;color:var(--muted);margin-top:10px">实际请求 Payload</summary><pre>${esc(requestText)}</pre></details>
    </div>`);
}

function benchStamp() {
  const d = new Date();
  const pad = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function benchDownload(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function benchSuccessfulRuns(batch) {
  return (batch?.runs || []).filter((r) => r.status === 'done' && String(r.output || '').trim());
}

function benchBlindMarkdown(batch) {
  if (!batch || !benchAllFinished(batch)) return null;
  const successful = benchSuccessfulRuns(batch);
  if (!successful.length) return null;
  const groups = new Map();
  for (const run of successful) {
    if (!groups.has(run.questionIndex)) groups.set(run.questionIndex, []);
    groups.get(run.questionIndex).push(run);
  }
  const lines = ['# 匿名评审包', '', '> 本文件仅包含测试问题与匿名答案，不含模型、提供商、上下文方案或运行编号等身份信息。', ''];
  for (const qIndex of Array.from(groups.keys()).sort((a, b2) => a - b2)) {
    const runs = groups.get(qIndex).slice().sort((a, b2) => String(a.blindId).localeCompare(String(b2.blindId)));
    lines.push(`## 题目 ${qIndex + 1}`, '', runs[0].question, '');
    for (const run of runs) {
      lines.push(`### ${run.blindId}`, '', String(run.output || '').trim(), '');
    }
  }
  return lines.join('\n');
}

function benchPreviewBlind() {
  const md = benchBlindMarkdown(benchFlags.current);
  if (!md) { toast('请先完成整个批次，并确保至少有一条成功输出', 'error'); return; }
  openModal('盲测包预览', `<div class="bench-hint">仅包含题目、匿名编号和答案；模型 / 提供商 / 方案 / 运行编号不在此文件中。</div><pre>${esc(md)}</pre>`);
}

function benchExportBlind() {
  const md = benchBlindMarkdown(benchFlags.current);
  if (!md) { toast('请先完成整个批次，并确保至少有一条成功输出', 'error'); return; }
  benchDownload(`blind-review-${benchStamp()}.md`, md, 'text/markdown');
  toast('盲测包已导出（文件名与内容不含身份信息）');
}

function benchExportKey() {
  const b = benchFlags.current;
  if (!b || !benchAllFinished(b)) { toast('请先完成整个批次后再导出', 'error'); return; }
  const successful = benchSuccessfulRuns(b).slice().sort((a, b2) => String(a.blindId).localeCompare(String(b2.blindId)));
  if (!successful.length) { toast('没有成功输出可导出', 'error'); return; }
  const payload = {
    type: 'answer-mapping',
    exportedAt: new Date().toISOString(),
    batchId: b.id,
    entries: successful.map((r) => ({
      blindId: r.blindId,
      provider: r.provider,
      model: r.model,
      modelLabel: r.modelLabel,
      scheme: r.schemeName,
      runIndex: r.index + 1,
      repeat: r.repeat,
      questionIndex: r.questionIndex + 1,
    })),
  };
  benchDownload(`answer-mapping-${benchStamp()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast('答案映射表已导出');
}

function benchExportFull() {
  const b = benchFlags.current;
  if (!b || !benchAllFinished(b)) { toast('请先完成整个批次后再导出', 'error'); return; }
  const data = {
    app: 'llm-desk',
    type: 'benchmark-data',
    version: 1,
    exportedAt: new Date().toISOString(),
    batch: {
      id: b.id,
      name: b.name,
      createdAt: b.createdAt,
      startedAt: b.startedAt,
      completedAt: b.completedAt,
      status: b.status,
      system: b.system,
      params: b.params,
      models: b.models,
      schemes: b.schemes,
      questions: benchQuestions(b),
      differences: b.differences,
    },
    runs: b.runs.map((r) => ({
      blindId: r.blindId,
      index: r.index + 1,
      provider: r.provider,
      model: r.model,
      modelLabel: r.modelLabel,
      schemeId: r.schemeId,
      schemeName: r.schemeName,
      questionIndex: r.questionIndex + 1,
      question: r.question,
      repeat: r.repeat,
      status: r.status,
      attempts: r.attempts,
      startedAt: r.startedAt,
      endedAt: r.endedAt,
      durationMs: r.durationMs,
      usage: r.usage,
      finishReason: r.finishReason,
      error: r.error,
      output: r.output,
      reasoning: r.reasoning,
      params: r.params,
      actualRequest: r.request,
      canonicalRequest: r.canonicalRequest,
    })),
  };
  const safe = String(b.name || 'batch').replace(/[^\w\u4e00-\u9fa5.-]+/g, '_').slice(0, 40);
  benchDownload(`benchmark-data-${safe}-${benchStamp()}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast('完整实验数据已导出');
}

/* ---------------- benchmark events ---------------- */

$('#openBenchBtn').addEventListener('click', openBenchPage);
$('#benchBack').addEventListener('click', closeBenchPage);
$('#benchNewBtn').addEventListener('click', benchNewBatch);
$('#benchRunBtn').addEventListener('click', benchStart);
$('#benchPauseBtn').addEventListener('click', () => {
  if (!benchFlags.running) return;
  if (benchFlags.paused) {
    benchFlags.paused = false;
    if (benchFlags.current) benchFlags.current.status = 'running';
    benchRenderAll();
    benchRunPool();
  } else {
    benchPause();
  }
});
$$('.bench-tabs button').forEach((btn) => btn.addEventListener('click', () => {
  benchFlags.tab = btn.dataset.btab;
  benchRenderAll();
}));

/* ============================================================ render all */
function renderAll() {
  renderSessionList();
  renderHeader();
  renderMessages();
  renderComposerState();
  renderPanel();
  autoGrow();
}

/* ============================================================ boot */
bootstrap().catch((err) => {
  console.error(err);
  toast('初始化失败：' + err.message, 'error');
});
})();
</script>
